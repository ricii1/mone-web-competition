# Use together with docker-compose.yml; development remains the default.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for deployment}
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  backend:
    build:
      args:
        INSTALL_DEV: "false"
        APP_USER: app
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for deployment}
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes: !override
      - uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 10"
    restart: unless-stopped

  worker:
    build:
      args:
        INSTALL_DEV: "false"
        APP_USER: app
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for deployment}
    volumes: !override
      - uploads:/data/uploads
      - model_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL for deployment}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL for deployment}
    env_file: !reset []
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes: !reset []
    command: ["node", "server.js"]
    restart: unless-stopped
